name: Tag release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel an upload halfway through a release. Serialize the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Master, version and license gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Refresh exact remote tag and master, then check policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A command-scoped header works for private repos without saving credentials.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git -c "http.extraheader=$header" fetch --no-tags --force origin "refs/heads/master:refs/remotes/origin/master" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          npm run check:release
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
        id: commit

  quality:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  bundle:
    name: Production bundle (${{ matrix.target }})
    needs: [guard, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_SHA: ${{ needs.guard.outputs.sha }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
      - name: Build macOS installers (ad-hoc only, not notarized)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
          BUILD_TARGET: ${{ matrix.target }}
        run: npm run tauri build -- --target "$BUILD_TARGET" --bundles dmg -- --locked
      - name: Build Windows installers (unsigned)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis,msi -- --locked
      - name: Validate macOS disk image container
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: hdiutil verify src-tauri/target/"$BUILD_TARGET"/release/bundle/dmg/*.dmg
      - name: Stage only expected installers and build metadata
        env:
          BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: node scripts/release-artifacts.mjs stage "$BUILD_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: release-stage/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish complete unsigned prerelease
    needs: [guard, quality, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ needs.guard.outputs.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: bundle-*
          path: downloaded
      - name: Validate complete matrix, identity and checksums
        run: node scripts/release-artifacts.mjs assemble
      - name: Recheck remote refs and publish only after all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git -c "http.extraheader=$header" fetch --no-tags --force origin "refs/heads/master:refs/remotes/origin/master" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          npm run check:release
          # Existing releases are never overwritten, including partial drafts.
          # Creation fails safely if another release already uses this tag.
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --title "技术点快搜 $RELEASE_TAG — unsigned preview" --notes-file .github/RELEASE_NOTES.md --draft --prerelease
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
